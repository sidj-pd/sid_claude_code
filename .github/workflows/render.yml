name: Render

# Nothing in this project can be watched on the phone it is authored on:
# remotion render needs a headless Chrome, and Android has neither an aarch64
# chromium nor a glibc to run the one Remotion downloads. So rendering happens
# here, and the MP4 comes back as a run artifact.
on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Composition id, or several separated by spaces (see src/Root.tsx)'
        required: true
        default: 'Ep04Shot00ColdOpen'
        type: string
      frames:
        description: 'Frame numbers to also export as stills, space separated'
        required: false
        default: '0 12 30 48 72 78 90 96 102 108 114 116 130 149'
        type: string
      crf:
        description: 'Quality — lower is better and bigger. 30 is the project default.'
        required: false
        default: '30'
        type: string
  push:
    branches: ['claude/**']
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - '.github/workflows/render.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      # public/cutouts-alpha/ is gitignored and regenerated from the source
      # art, so it does not exist on a fresh checkout. Without this the render
      # paints every cutout as a missing image.
      - name: Key the cutouts
        run: |
          node scripts/cutout-alpha.mjs
          node scripts/split-meter.mjs
          node scripts/crop-newspaper-clippings.mjs

      # Deterministic and free — no API key needed, unlike the voice-over,
      # whose takes are committed under public/vo/.
      - name: Synthesise sound effects
        run: python3 scripts/sfx.py

      - name: Typecheck
        run: npx tsc --noEmit

      # A push-triggered run has no inputs at all, so every default has to be
      # repeated here as a shell fallback. That is the trap: the `default:`
      # values up in workflow_dispatch look authoritative and are ignored on
      # push, so changing only those silently renders whatever was hardcoded
      # here instead -- which has now cost four runs across two episodes.
      # SHOT is the single place to change when moving to a new shot.
      - name: Resolve what to render
        id: what
        env:
          SHOT: KhareHelyoTitle
          SHOT_FRAMES: '0 30 60'
        run: |
          COMP="${{ github.event.inputs.composition }}"
          CRF="${{ github.event.inputs.crf }}"
          FRAMES="${{ github.event.inputs.frames }}"
          echo "composition=${COMP:-$SHOT}" >> "$GITHUB_OUTPUT"
          echo "crf=${CRF:-30}" >> "$GITHUB_OUTPUT"
          echo "frames=${FRAMES:-$SHOT_FRAMES}" >> "$GITHUB_OUTPUT"
          echo "rendering ${COMP:-$SHOT} at frames ${FRAMES:-$SHOT_FRAMES}"

      # Remotion downloads its own Chrome Headless Shell on first render.
      # (There is no `remotion browser ensure` in 4.0.515 — that subcommand
      # arrived later, and calling it here would fail the run.)
      # `composition` accepts a SPACE-SEPARATED LIST. One run that renders nine
      # shots beats nine runs: each dispatch costs a fresh checkout, an npm ci,
      # a cutout re-key and a Chrome download before it renders a single frame,
      # and that setup is most of the wall clock on a short shot.
      - name: Render
        run: |
          mkdir -p out
          for C in ${{ steps.what.outputs.composition }}; do
            echo "::group::$C"
            npx remotion render "$C" "out/$C.mp4" --crf "${{ steps.what.outputs.crf }}"
            echo "::endgroup::"
          done

      # Stills as well as the movie. Audio cannot be heard and motion cannot
      # be watched while reviewing from a phone, so a few key frames are the
      # only way to actually look at a shot — §12 rule 20.
      # Stills only make sense against ONE composition -- a frame number means
      # something different in each -- so they are skipped when several were
      # asked for. `|| true` because a frame past a composition's end is a
      # mistake in the request, not a reason to lose the movie.
      - name: Render key frames
        run: |
          set -- ${{ steps.what.outputs.composition }}
          if [ "$#" -ne 1 ]; then
            echo "several compositions rendered; skipping stills"
            exit 0
          fi
          for F in ${{ steps.what.outputs.frames }}; do
            npx remotion still "$1" "out/$1-f${F}.png" --frame="$F" || true
          done

      - name: Report what landed
        run: ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.what.outputs.composition }}
          path: |
            out/*.mp4
            out/*.png
          retention-days: 30
          if-no-files-found: error
